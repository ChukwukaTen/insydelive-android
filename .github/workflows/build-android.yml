# Builds the InsydeLive Android TEST app every time this repository changes (or when you press "Run workflow").
# Result:
#   - Releases page: "Test build N" with the installable InsydeLive-test-....apk (open it on the Android phone, tap the file)
#   - also kept under the run's "Artifacts" for 30 days
name: Build Android test app

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to publish the test build on the Releases page

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # true once the Play Store upload key has been added under Settings -> Secrets and variables -> Actions
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 != '' && secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Copy the app files into the Android project
        run: npx cap sync android

      - name: Build the test app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PinsydeVersionCode=${GITHUB_RUN_NUMBER} --no-daemon --stacktrace

      # Each key check is its own step, so a failure shows WHICH part is wrong without ever printing a secret.
      - name: "Key check 1: the key text in GitHub Secrets can be read"
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEY_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEY_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "decoded size: $(stat -c %s "$RUNNER_TEMP/upload.jks") bytes"

      - name: "Key check 2: it is the InsydeLive upload key (fingerprint matches)"
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          echo "f8a73aa33d4605792e69193e28da997aff5eb20d1d6396ea5c6bf9fd8283e2ee  $RUNNER_TEMP/upload.jks" | sha256sum -c -

      - name: "Key check 3: the password in GitHub Secrets opens the key"
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          RAW_PW: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          PW=$(printf '%s' "$RAW_PW" | tr -d ' \r\n\t')
          echo "password length: ${#PW}"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storetype PKCS12 -storepass "$PW" -alias upload > /dev/null

      - name: Build the Play Store version
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          RAW_PW: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -e
          export INSYDE_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          export INSYDE_UPLOAD_PASSWORD=$(printf '%s' "$RAW_PW" | tr -d ' \r\n\t')
          ./gradlew bundleRelease -PinsydeVersionCode=${GITHUB_RUN_NUMBER} --no-daemon --stacktrace
          rm -f "$INSYDE_UPLOAD_KEYSTORE"

      - name: Name the file
        id: name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="InsydeLive-test-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${FILE}"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/InsydeLive-STORE-${VERSION}-code${GITHUB_RUN_NUMBER}.aab"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check what is inside the app before publishing it
        run: |
          APK="out/${{ steps.name.outputs.file }}"
          set -e
          unzip -l "$APK" | grep -q "assets/public/index.html"           || { echo "MISSING: app files"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/icons/icon-512.png"   || { echo "MISSING: icon"; exit 1; }
          unzip -p "$APK" assets/capacitor.config.json | grep -q '"appId": "com.insydelive.app"' || { echo "WRONG app ID"; exit 1; }
          unzip -p "$APK" assets/capacitor.config.json | grep -q '"hostname": "app.insydelive.com"' || { echo "WRONG hostname"; exit 1; }
          unzip -p "$APK" assets/public/index.html | grep -q "APP_VERSION = '${{ steps.name.outputs.version }}'" || { echo "WRONG app version inside"; exit 1; }
          unzip -p "$APK" assets/public/index.html | grep -q "bjtialxcvyjdxwurysbv.supabase.co" || { echo "NOT the production database"; exit 1; }
          if unzip -p "$APK" assets/public/index.html | grep -q "qefslvaqnakxgkmxxlsi"; then echo "DEV database found - stop"; exit 1; fi
          echo "All checks passed: app ID, hostname, version ${{ steps.name.outputs.version }}, production database, icon."
          ls -la "$APK"

      - name: Check the Play Store version
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          set -e
          AAB=$(ls out/*.aab)
          unzip -l "$AAB" | grep -q "base/assets/public/index.html" || { echo "MISSING: app files"; exit 1; }
          unzip -p "$AAB" base/assets/capacitor.config.json | grep -q '"appId": "com.insydelive.app"' || { echo "WRONG app ID"; exit 1; }
          unzip -p "$AAB" base/assets/public/index.html | grep -q "bjtialxcvyjdxwurysbv.supabase.co" || { echo "NOT the production database"; exit 1; }
          if unzip -p "$AAB" base/assets/public/index.html | grep -q "qefslvaqnakxgkmxxlsi"; then echo "DEV database found - stop"; exit 1; fi
          CERT=$(keytool -printcert -jarfile "$AAB")
          echo "$CERT" | grep -q "CN=InsydeLive" || { echo "NOT signed with the InsydeLive upload key"; exit 1; }
          if echo "$CERT" | grep -q "Android Debug"; then echo "Signed with the TEST key - stop"; exit 1; fi
          echo "Store version OK, signed by:"; echo "$CERT" | grep -E "Owner:|SHA256:"
          ls -la "$AAB"

      - uses: actions/upload-artifact@v5
        with:
          name: InsydeLive-test-app
          path: out/*
          retention-days: 30

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: "Test build ${{ github.run_number }} (app files v${{ steps.name.outputs.version }})"
          prerelease: true
          body: |
            InsydeLive Android TEST app - for testing only, not the Play Store version.
            On your Android phone: tap the .apk file below, then Open / Install.
            (The first time, Android asks you to allow installs from your browser - allow it for this install.)
            If there is also an InsydeLive-STORE-....aab file: that one is for uploading to Google Play Console only (it does not install on a phone).
          files: out/*

# Builds the InsydeLive iPhone app and uploads it to App Store Connect / TestFlight.
# Runs when the app files or the iPhone project change, or when you press "Run workflow".
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_PRIVATE_KEY (the whole .p8 file)
# Build number = this workflow's run number. App version = "version" in package.json.
name: Build iPhone app

on:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch: {}

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: VUG29SM8HB
      KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Choose Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this runner:"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Copy the app files into the iPhone project
        run: npx cap sync ios

      - name: Check what is inside the app
        run: |
          set -e
          F=ios/App/App/public/index.html
          VERSION=$(node -p "require('./package.json').version")
          grep -q "APP_VERSION = '${VERSION}'" "$F" || { echo "WRONG app version inside (package.json says $VERSION)"; exit 1; }
          grep -q "bjtialxcvyjdxwurysbv.supabase.co" "$F" || { echo "NOT the production database"; exit 1; }
          if grep -q "qefslvaqnakxgkmxxlsi" "$F"; then echo "DEV database found - stop"; exit 1; fi
          grep -q '"appId": "com.insydelive.app"' ios/App/App/capacitor.config.json || { echo "WRONG app ID"; exit 1; }
          echo "App files OK: version $VERSION, production database, app ID com.insydelive.app"

      - name: Key check 1 - Key ID secret is there
        run: |
          if [ -z "$KEY_ID" ]; then echo "::error title=Key check 1::Secret APPSTORE_API_KEY_ID is missing or empty"; exit 1; fi
          echo "Key ID is ${#KEY_ID} characters long (should be 10)"
          if [ ${#KEY_ID} -ne 10 ]; then echo "::error title=Key check 1::APPSTORE_API_KEY_ID is ${#KEY_ID} characters, should be 10"; exit 1; fi

      - name: Key check 2 - Issuer ID secret is there
        run: |
          if [ -z "$ISSUER_ID" ]; then echo "::error title=Key check 2::Secret APPSTORE_API_ISSUER_ID is missing or empty"; exit 1; fi
          if ! echo "$ISSUER_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then echo "::error title=Key check 2::APPSTORE_API_ISSUER_ID is ${#ISSUER_ID} characters and not in the 8-4-4-4-12 form"; exit 1; fi

      - name: Key check 3 - private key file looks right
        env:
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error title=Key check 3::Secret APPSTORE_API_PRIVATE_KEY is missing or empty"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          F="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$KEY" | tr -d '\r' > "$F"
          grep -q "BEGIN PRIVATE KEY" "$F" || { echo "::error title=Key check 3::APPSTORE_API_PRIVATE_KEY has no BEGIN PRIVATE KEY line"; exit 1; }
          grep -q "END PRIVATE KEY" "$F" || { echo "::error title=Key check 3::APPSTORE_API_PRIVATE_KEY has no END PRIVATE KEY line (cut short?)"; exit 1; }
          L=$(wc -l < "$F" | tr -d ' ')
          echo "Key file has $L lines"
          if [ "$L" -lt 3 ]; then echo "::error title=Key check 3::APPSTORE_API_PRIVATE_KEY is all on one line ($L) - the line breaks were lost"; exit 1; fi
          openssl pkey -in "$F" -noout 2>/dev/null || { echo "::error title=Key check 3::APPSTORE_API_PRIVATE_KEY is not a readable private key"; exit 1; }
          echo "KEY_PATH=$F" >> "$GITHUB_ENV"
          echo "Key file OK"

      - name: Build (archive, not signed yet - signing happens at upload)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          set +e
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/InsydeLive.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          RC=$?
          tail -n 80 "$RUNNER_TEMP/archive.log"
          if [ $RC -ne 0 ]; then
            grep -E "error:|error [A-Z]|No profiles|No Accounts|Signing|provisioning|requires a development team" "$RUNNER_TEMP/archive.log" | sort -u | head -n 8 | while IFS= read -r line; do
              echo "::error title=Build::$(echo "$line" | cut -c1-400)"
            done
            exit $RC
          fi

      - name: Upload to App Store Connect (TestFlight)
        run: |
          set +e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/InsydeLive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1
          RC=$?
          tail -n 60 "$RUNNER_TEMP/export.log"
          if [ $RC -ne 0 ]; then
            grep -E "error|Error|ERROR|failed|Failed" "$RUNNER_TEMP/export.log" | sort -u | head -n 8 | while IFS= read -r line; do
              echo "::error title=Upload::$(echo "$line" | cut -c1-400)"
            done
            exit $RC
          fi
          echo "Uploaded build $GITHUB_RUN_NUMBER (version $(node -p "require('./package.json').version")). It appears in App Store Connect -> TestFlight after Apple finishes processing (usually 5-30 minutes)."

      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
